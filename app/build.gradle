plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace 'com.example.qrstream'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.qrstream"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Keep Crashlytics quiet for local debugging builds.
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }

    testOptions {
        unitTests {
            // The protocol package has no Android dependencies, but this keeps
            // accidental android.util.Log calls from crashing unit tests.
            returnDefaultValues = true
        }
    }
}

dependencies {
    // --- UI ---
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // --- Camera (CameraX) ---
    def camerax_version = "1.4.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    implementation 'com.google.guava:guava:31.1-android'

    // --- Barcode decoding: ML Kit, bundled model (works offline) ---
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // --- QR generation ---
    implementation 'com.google.zxing:core:3.5.3'

    // --- Background sync ---
    implementation 'androidx.work:work-runtime:2.9.1'

    // --- Firebase (versions managed by the BoM) ---
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-crashlytics'

    // --- Unit tests (pure Java protocol logic) ---
    testImplementation 'junit:junit:4.13.2'

    // --- Instrumented tests ---
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
